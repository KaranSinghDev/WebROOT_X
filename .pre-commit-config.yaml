# Tell pre-commit to globally ignore compiled Wasm artifacts
exclude: '^frontend/public/wasm/.*'

repos:
  # 1. Standard Sanity Checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=5000']

  # 2. C++ Formatting (CERN Standard)
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v17.0.6
    hooks:
      - id: clang-format
        types_or: [c++, c]
        args: ['-style=LLVM', '-i']

  # 3. Frontend Formatting (React/JS/CSS)
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [javascript, jsx, css, json]
