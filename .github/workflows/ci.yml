name: WebROOT-X CI/CD Pipeline

on:
  push:
    branches: [ "Release", "Build" ]
  pull_request:
    branches: [ "Release", "Build" ]

jobs:
  # --- STAGE 1: Static Analysis ---
  # Proves the code is logically safe without running it
  code-quality:
    name: Static Analysis (CppCheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install CppCheck
        run: sudo apt-get install -y cppcheck

      - name: Run CppCheck
        # -I specifies the include directory
        # --enable=warning,style,performance,portability checks for memory leaks, bad C++ practices, and slow code
        # --suppress=missingInclude ignores missing Emscripten headers which aren't installed on the raw Ubuntu runner
        run: >
          cppcheck
          --enable=warning,style,performance,portability
          --error-exitcode=1
          --suppress=missingInclude
          -I ./engine/include
          ./engine/src ./wasm_bridge/src

  # --- STAGE 2: Verification & Memory Safety ---
  # Proves the math is right AND no memory leaks occur during execution
  verify-engine:
    name: Verify Math & Memory Safety (ASan)
    runs-on: ubuntu-latest
    needs: code-quality # Only runs if Stage 1 passes

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Run Unit Tests (with ASan)
        run: |
          mkdir build && cd build
          # We pass the ASAN flag we created in CMake
          cmake -DENABLE_ASAN=ON ../engine
          cmake --build .
          # Run tests. If there is a memory leak, ASan will intercept and crash this step.
          ./unit_tests

  # --- STAGE 3: WebAssembly Compilation ---
  build-and-deploy:
    name: Build Wasm & Frontend
    runs-on: ubuntu-latest
    needs: verify-engine # Only runs if Stage 2 passes

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Wasm output directory
        run: mkdir -p frontend/public/wasm

      - name: Compile C++ to WebAssembly
        uses: docker://emscripten/emsdk:3.1.51
        with:
          args: >
            emcc -O3
            -I/github/workspace/engine/include
            /github/workspace/wasm_bridge/src/bindings.cpp
            /github/workspace/engine/src/analyzer.cpp
            -s WASM=1
            -s MODULARIZE=1
            -s EXPORT_NAME="WebROOTModule"
            --bind
            -o /github/workspace/frontend/public/wasm/webroot.js

      - name: Verify Wasm Artifacts
        run: ls -lh frontend/public/wasm

      - name: Build Frontend Docker Image
        run: docker compose build frontend
